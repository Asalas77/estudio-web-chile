<!doctype html>
<html lang="es-CL">

    <meta charset="UTF-8" />

    <meta name="description" content="Diseño de páginas web, tiendas online y automatización con WhatsApp en Curicó, Región del Maule. Calcula el precio de tu sitio web en 30 segundos, sin reuniones ni cotizaciones a ciegas." />
    <meta name="theme-color" content="#f6f7fb" />
    <link rel="canonical" href="https://tudominio.cl/" />
    <script>
      // Aplica el tema guardado antes del primer render, para evitar el
      // parpadeo de modo claro→oscuro (o viceversa) al cargar la página.
      try {
        if (localStorage.getItem('tema') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {}
    </script>

    <meta property="og:type" content="website" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
